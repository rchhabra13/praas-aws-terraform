name: AI PR Review

on:
  pull_request:

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      # Only needed to get scripts/ onto the runner — the diff itself comes
      # from the GitHub API, not from git, so default checkout depth is fine.
      - uses: actions/checkout@v4

      - name: DEBUG decode OIDC token claims
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | python3 -c "import json,sys; print(json.load(sys.stdin)['value'])")
          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f2)
          python3 -c "
          import base64, json
          s = '$PAYLOAD'
          s += '=' * (-len(s) % 4)
          claims = json.loads(base64.urlsafe_b64decode(s))
          print(json.dumps({k: claims.get(k) for k in ['aud','sub','iss','repository','ref']}, indent=2))
          "

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r scripts/requirements.txt

      - run: python scripts/bedrock_review.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          AWS_REGION: us-east-1
          BEDROCK_MODEL_ID: amazon.nova-pro-v1:0
